<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnostic systémique — Carnet de séance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFEEE6;
    --paper-2:#E7E4D8;
    --ink:#1D1E19;
    --muted:#6E6C60;
    --line:#D3CFBF;
    --structure:#33475B;
    --structure-soft:#33475B14;
    --lever:#9C6B30;
    --lever-soft:#9C6B3016;
    --danger:#8C3B2E;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  h1,h2,.serif{font-family:'Source Serif 4', serif;}
  ::selection{background:var(--structure); color:var(--paper);}

  /* focus visibility */
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:2px solid var(--structure);
    outline-offset:2px;
  }

  /* ---------- shell ---------- */
  .app{
    position:relative;
    height:100vh;
    width:100vw;
    display:flex;
    flex-direction:column;
  }

  .topbar{
    padding:22px clamp(20px,5vw,64px) 0;
    flex-shrink:0;
  }
  .wordmark{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .wordmark .name{
    font-size:13px;
    letter-spacing:.01em;
    color:var(--muted);
  }
  .wordmark .name b{color:var(--ink); font-weight:600;}
  .wordmark .session-tag{
    font-size:12px;
    color:var(--muted);
  }

  .progress-track{
    height:2px;
    background:var(--line);
    border-radius:2px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--structure);
    width:0%;
    transition:width .5s cubic-bezier(.65,0,.35,1);
  }
  .app.on-synthesis .progress-fill{background:var(--lever);}

  .step-dots{
    display:flex;
    gap:6px;
    margin-top:10px;
  }
  .step-dot{
    border:none;
    background:none;
    cursor:pointer;
    padding:4px 2px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:11px;
    color:var(--muted);
    position:relative;
  }
  .step-dot::after{
    content:"";
    position:absolute;
    left:2px; right:2px; bottom:0;
    height:2px;
    background:transparent;
  }
  .step-dot.active{color:var(--ink); font-weight:600;}
  .step-dot.active::after{background:var(--structure);}
  .app.on-synthesis .step-dot.active::after{background:var(--lever);}
  .step-dot:disabled{cursor:default; opacity:.35;}

  /* ---------- stage ---------- */
  .stage{
    flex:1;
    position:relative;
    overflow:hidden;
  }
  .slide{
    position:absolute;
    inset:0;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:clamp(28px,7vh,72px) clamp(20px,5vw,64px) 24px;
    overflow-y:auto;
    opacity:0;
    transform:translateY(14px);
    pointer-events:none;
    transition:opacity .38s ease, transform .38s ease;
  }
  .slide.active{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }
  @media (prefers-reduced-motion: reduce){
    .slide{transition:opacity .15s linear; transform:none;}
    .progress-fill{transition:none;}
  }

  .slide-inner{
    width:100%;
    max-width:660px;
  }

  .eyebrow{
    font-size:13px;
    color:var(--muted);
    margin:0 0 10px;
  }
  .eyebrow .num{color:var(--structure); font-weight:600;}

  h1.question{
    font-size:clamp(26px,3.6vw,38px);
    line-height:1.24;
    font-weight:500;
    margin:0 0 8px;
    letter-spacing:-.01em;
  }
  p.hint{
    font-size:14.5px;
    color:var(--muted);
    line-height:1.55;
    margin:0 0 34px;
    max-width:54ch;
  }

  .field{
    margin-bottom:26px;
  }
  .field label{
    display:block;
    font-size:14.5px;
    font-weight:600;
    margin-bottom:8px;
    color:var(--ink);
  }
  .field .sub{
    display:block;
    font-weight:400;
    color:var(--muted);
    font-size:13px;
    margin-top:2px;
  }
  input[type=text], input[type=date], textarea{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1.5px solid var(--line);
    padding:9px 2px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:16px;
    color:var(--ink);
    resize:none;
    line-height:1.5;
    transition:border-color .2s ease;
  }
  input[type=text]:hover, input[type=date]:hover, textarea:hover{border-color:#B7B29E;}
  input[type=text]:focus, input[type=date]:focus, textarea:focus{
    border-color:var(--structure);
    outline:none;
  }
  textarea{min-height:64px; field-sizing:content;}
  input::placeholder, textarea::placeholder{color:#9A9788;}

  .grid-2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px 32px;
  }
  @media (max-width:640px){ .grid-2{grid-template-columns:1fr;} }

  /* step 0 */
  .field-compact{margin-bottom:22px;}
  .field-compact label{font-size:13.5px; color:var(--muted); font-weight:500; margin-bottom:6px;}

  /* step 3 — fill in the blank sentence */
  .sentence{
    font-family:'Source Serif 4', serif;
    font-size:clamp(20px,2.6vw,27px);
    line-height:2.05;
    font-weight:400;
  }
  .sentence input{
    font-family:'Source Serif 4', serif;
    font-style:italic;
    font-size:inherit;
    display:inline-block;
    width:auto;
    min-width:120px;
    border-bottom:1.5px solid var(--structure);
    padding:0 4px 2px;
  }
  .sentence input::placeholder{font-style:normal; font-size:14px; font-family:'IBM Plex Sans', sans-serif;}
  .w-sys{width:170px;}
  .w-etat{width:150px;}
  .w-t{width:220px;}
  .w-w{width:260px;}

  /* step 5 — crash test */
  .crashq{
    border-top:1px solid var(--line);
    padding:20px 0;
  }
  .crashq:last-of-type{border-bottom:1px solid var(--line); margin-bottom:24px;}
  .crashq-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:20px;
  }
  .crashq p{margin:0; font-size:16px; line-height:1.5; max-width:44ch;}
  .toggle{display:flex; gap:8px; flex-shrink:0;}
  .toggle button{
    border:1.5px solid var(--line);
    background:transparent;
    color:var(--muted);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13px;
    font-weight:600;
    padding:7px 16px;
    border-radius:20px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .toggle button:hover{border-color:var(--ink); color:var(--ink);}
  .toggle button.sel-oui.selected{background:var(--structure); border-color:var(--structure); color:#fff;}
  .toggle button.sel-non.selected{background:var(--danger); border-color:var(--danger); color:#fff;}
  .pathology{
    margin-top:10px;
    font-size:13px;
    color:var(--danger);
  }
  .pathology b{font-weight:600;}
  .adjustment{
    background:var(--structure-soft);
    border-left:2px solid var(--structure);
    padding:16px 18px;
    border-radius:0 var(--radius) var(--radius) 0;
  }
  .adjustment label{font-size:13.5px; font-weight:600; margin-bottom:8px; display:block;}

  /* nav */
  .navbar{
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px clamp(20px,5vw,64px) 22px;
    gap:16px;
  }
  .navbar .kbd-hint{
    font-size:12px;
    color:var(--muted);
  }
  .navbar .kbd-hint kbd{
    font-family:'IBM Plex Sans', sans-serif;
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:3px;
    padding:1px 5px;
    font-size:11px;
  }
  .nav-buttons{display:flex; gap:10px;}
  button.btn{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14.5px;
    font-weight:600;
    padding:11px 22px;
    border-radius:24px;
    cursor:pointer;
    border:1.5px solid transparent;
    transition:all .15s ease;
  }
  .btn-ghost{background:transparent; border-color:var(--line); color:var(--ink);}
  .btn-ghost:hover{border-color:var(--ink);}
  .btn-primary{background:var(--structure); color:#fff;}
  .btn-primary:hover{background:#28394A;}
  .app.on-synthesis .btn-primary{background:var(--lever);}
  .app.on-synthesis .btn-primary:hover{background:#82581F;}
  button.btn:disabled{opacity:.3; cursor:default;}

  /* ---------- synthesis ---------- */
  .synth-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:20px;
    border-bottom:1.5px solid var(--ink);
    padding-bottom:16px;
    margin-bottom:28px;
  }
  .synth-head h1{font-size:clamp(24px,3.2vw,32px); font-weight:500; margin:0 0 4px;}
  .synth-head .meta{font-size:13.5px; color:var(--muted);}
  .synth-actions{display:flex; gap:8px; flex-shrink:0;}
  .synth-actions button{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13px;
    font-weight:600;
    padding:8px 14px;
    border-radius:20px;
    border:1.5px solid var(--line);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
  }
  .synth-actions button:hover{border-color:var(--ink);}

  .synth-section{margin-bottom:26px;}
  .synth-section h2{
    font-size:12px;
    font-weight:600;
    text-transform:none;
    color:var(--structure);
    margin:0 0 10px;
    font-family:'IBM Plex Sans', sans-serif;
    letter-spacing:.01em;
  }
  .synth-section .lever-label{color:var(--lever);}
  .synth-row{
    display:grid;
    grid-template-columns:190px 1fr;
    gap:4px 18px;
    padding:9px 0;
    border-top:1px solid var(--line);
    font-size:14.5px;
    line-height:1.55;
  }
  .synth-row .k{color:var(--muted); font-size:13px;}
  .synth-row .v{white-space:pre-wrap;}
  .synth-row .v.empty{color:#B0AC9C; font-style:italic;}
  .synth-lever{
    background:var(--lever-soft);
    border-left:2px solid var(--lever);
    padding:18px 20px;
    border-radius:0 var(--radius) var(--radius) 0;
  }
  .synth-lever .synth-row{border-top:1px solid #9C6B301f;}
  .synth-lever .synth-row:first-child{border-top:none;}

  @media print{
    body{overflow:visible; background:#fff;}
    .app{height:auto; overflow:visible;}
    .topbar, .navbar{display:none !important;}
    .stage{overflow:visible; height:auto;}
    .slide{
      position:static !important;
      opacity:1 !important; transform:none !important;
      padding:0 24px;
      display:none;
    }
    .slide.active{display:flex !important;}
    .synth-actions{display:none;}
  }
</style>
</head>
<body>

<div class="app" id="app">

  <div class="topbar">
    <div class="wordmark">
      <div class="name">Diagnostic systémique <span id="sessionName"></span></div>
      <div class="session-tag" id="sessionTag"></div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="step-dots" id="stepDots"></div>
  </div>

  <div class="stage" id="stage"></div>

  <div class="navbar">
    <button class="btn btn-ghost" id="btnPrev">Précédent</button>
    <div class="kbd-hint">Naviguer : <kbd>←</kbd> <kbd>→</kbd></div>
    <button class="btn btn-primary" id="btnNext">Suivant</button>
  </div>

</div>

<script>
(function(){

  // ---------------- state ----------------
  const state = {
    meta:{ dirigeant:'', entreprise:'', date: new Date().toISOString().slice(0,10) },
    s1:{ enonce:'', declencheur:'' },
    s2:{ acteurs:'', ressources:'', contraintes:'', tensions:'' },
    s3:{ systeme:'', etatA:'', etatB:'', t:'', w:'' },
    s4:{ client:'', acteurs:'', owner:'', environnement:'' },
    s5:{ q1:null, q2:null, q3:null, q4:null, ajustement:'' },
    s6:{ action:'', porteur:'', signal:'', delai:'' }
  };

  const STEP_LABELS = ['Accueil','Cadrage','Cartographie','T + W','CATWOE','Crash-test','Levier','Synthèse'];
  let current = 0; // 0..7, 7 = synthesis
  const LAST_STEP = 7;

  const pathologies = {
    q1:'Inversion des rôles — captation du But',
    q2:'Erreur de cadrage — illusion d\u2019exécution',
    q3:'Trou de gouvernance — illusion de contrôle',
    q4:'Dérive des attributs — dogme / faux garant'
  };

  // ---------------- helpers ----------------
  function el(tag, attrs, children){
    const e = document.createElement(tag);
    if(attrs) for(const k in attrs){
      if(k==='class') e.className = attrs[k];
      else if(k==='html') e.innerHTML = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(c=> e.appendChild(c));
    return e;
  }

  function field(labelText, subText, key, obj, opts){
    opts = opts || {};
    const wrap = el('div', {class:'field'});
    const label = el('label', {}, [document.createTextNode(labelText)]);
    if(subText) label.appendChild(el('span',{class:'sub'},[document.createTextNode(subText)]));
    wrap.appendChild(label);
    let input;
    if(opts.textarea){
      input = el('textarea', {rows: opts.rows || 2, placeholder: opts.placeholder || ''});
    } else {
      input = el('input', {type: opts.type || 'text', placeholder: opts.placeholder || ''});
    }
    input.value = obj[key] || '';
    input.addEventListener('input', ()=>{ obj[key] = input.value; });
    wrap.appendChild(input);
    return wrap;
  }

  // ---------------- slide builders ----------------
  function buildSlide0(){
    const wrap = el('div', {class:'slide-inner'});
    wrap.appendChild(el('p',{class:'eyebrow'},[document.createTextNode('Étape 0 — Nouvelle séance')]));
    wrap.appendChild(el('h1',{class:'question'},[document.createTextNode('Avec qui travaillez-vous aujourd\u2019hui ?')]));
    wrap.appendChild(el('p',{class:'hint'},[document.createTextNode('Ces informations restent locales à cette session du navigateur — pensez à imprimer ou copier la synthèse en fin de séance.')]));

    const grid = el('div',{class:'grid-2'});
    grid.appendChild(field('Dirigeant', null, 'dirigeant', state.meta, {placeholder:'Nom du dirigeant'}));
    grid.appendChild(field('Entreprise', null, 'entreprise', state.meta, {placeholder:'Nom de la structure'}));
    wrap.appendChild(grid);
    wrap.appendChild(field('Date de la séance', null, 'date', state.meta, {type:'date'}));
    return wrap;
  }

  function buildSlide1(){
    const wrap = el('div', {class:'slide-inner'});
    wrap.appendChild(el('p',{class:'eyebrow'},[el('span',{class:'num'},[document.createTextNode('01')]),document.createTextNode(' — Cadrage & verbalisation')]));
    wrap.appendChild(el('h1',{class:'question'},[document.createTextNode('Quel est le problème, tel qu\u2019il se pose aujourd\u2019hui ?')]));
    wrap.appendChild(el('p',{class:'hint'},[document.createTextNode('Laissez le dirigeant parler deux minutes, puis notez sa formulation sans la rendre plus élégante ou plus théorique qu\u2019elle ne l\u2019est.')]));
    wrap.appendChild(field('L\u2019énoncé du problème', 'en une phrase, validée par un « oui » net du dirigeant', 'enonce', state.s1, {textarea:true, rows:2, placeholder:'Ex : « On n\u2019arrive plus à faire avancer le projet X sans que je porte tout moi-même »'}));
    wrap.appendChild(field('Le déclencheur récent', 'qu\u2019est-ce qui rend ce sujet urgent maintenant ?', 'declencheur', state.s1, {textarea:true, rows:2, placeholder:'L\u2019évènement de la semaine ou du mois écoulé'}));
    return wrap;
  }

  function buildSlide2(){
    const wrap = el('div', {class:'slide-inner'});
    wrap.appendChild(el('p',{class:'eyebrow'},[el('span',{class:'num'},[document.createTextNode('02')]),document.createTextNode(' — Cartographie de la situation réelle')]));
    wrap.appendChild(el('h1',{class:'question'},[document.createTextNode('Que se passe-t-il réellement sur le terrain ?')]));
    wrap.appendChild(el('p',{class:'hint'},[document.createTextNode('Les faits observés — pas l\u2019organigramme théorique.')]));
    const grid = el('div',{class:'grid-2'});
    grid.appendChild(field('Acteurs réels', 'personnes et groupes réellement impliqués', 'acteurs', state.s2, {textarea:true, rows:3}));
    grid.appendChild(field('Ressources effectives', 'temps, budget, compétences réellement mobilisables', 'ressources', state.s2, {textarea:true, rows:3}));
    grid.appendChild(field('Contraintes dures', 'règles, délais légaux, limites non négociables', 'contraintes', state.s2, {textarea:true, rows:3}));
    grid.appendChild(field('Points de tension', 'faits bruts de friction et de blocage au quotidien', 'tensions', state.s2, {textarea:true, rows:3}));
    wrap.appendChild(grid);
    return wrap;
  }

  function sentInput(cls, key, placeholder, size){
    const i = el('input', {type:'text', class: 'w-'+size, placeholder});
    i.value = state.s3[key] || '';
    i.addEventListener('input', ()=>{ state.s3[key] = i.value; });
    return i;
  }

  function buildSlide3(){
    const wrap = el('div', {class:'slide-inner'});
    wrap.appendChild(el('p',{class:'eyebrow'},[el('span',{class:'num'},[document.createTextNode('03')]),document.createTextNode(' — Transformation & Weltanschauung')]));
    wrap.appendChild(el('h1',{class:'question'},[document.createTextNode('Quel changement voulez-vous obtenir, et pourquoi y croyez-vous ?')]));
    wrap.appendChild(el('p',{class:'hint'},[document.createTextNode('Complétez la phrase — le gabarit force la précision.')]));

    const s = el('p', {class:'sentence'});
    s.appendChild(document.createTextNode('Faire passer '));
    s.appendChild(sentInput('w-sys','systeme','le système / la situation','sys'));
    s.appendChild(document.createTextNode(' de '));
    s.appendChild(sentInput('w-etat','etatA','l\u2019état actuel (A)','etat'));
    s.appendChild(document.createTextNode(' à '));
    s.appendChild(sentInput('w-etat','etatB','l\u2019état visé (B)','etat'));
    s.appendChild(document.createTextNode(' pour '));
    s.appendChild(sentInput('w-t','t','la transformation (T)','t'));
    s.appendChild(document.createTextNode(', parce que je crois que '));
    s.appendChild(sentInput('w-w','w','la croyance sous-jacente (W)','w'));
    s.appendChild(document.createTextNode('.'));
    wrap.appendChild(s);
    return wrap;
  }

  function buildSlide4(){
    const wrap = el('div', {class:'slide-inner'});
    wrap.appendChild(el('p',{class:'eyebrow'},[el('span',{class:'num'},[document.createTextNode('04')]),document.createTextNode(' — Filtrage des 4 rôles (CATWOE)')]));
    wrap.appendChild(el('h1',{class:'question'},[document.createTextNode('Qui est réellement concerné par cette transformation ?')]));
    wrap.appendChild(el('p',{class:'hint'},[document.createTextNode('On ne recartographie pas tout — on filtre uniquement pour le T formulé à l\u2019étape précédente.')]));
    wrap.appendChild(field('Client', 'le bénéficiaire réel et direct de la transformation', 'client', state.s4, {textarea:true, rows:2}));
    wrap.appendChild(field('Acteurs', 'exécutants du changement, et personnes qui en subiront l\u2019impact', 'acteurs', state.s4, {textarea:true, rows:2}));
    wrap.appendChild(field('Owner', 'qui a le pouvoir réel d\u2019arrêter ou de bloquer le projet', 'owner', state.s4, {textarea:true, rows:2}));
    wrap.appendChild(field('Environnement', 'limites externes spécifiques à cette transformation', 'environnement', state.s4, {textarea:true, rows:2}));
    return wrap;
  }

  function crashQuestion(key, question){
    const box = el('div',{class:'crashq'});
    const top = el('div',{class:'crashq-top'});
    top.appendChild(el('p',{},[document.createTextNode(question)]));
    const toggle = el('div',{class:'toggle'});
    const btnOui = el('button',{class:'sel-oui'},[document.createTextNode('Oui')]);
    const btnNon = el('button',{class:'sel-non'},[document.createTextNode('Non')]);
    function refresh(){
      btnOui.classList.toggle('selected', state.s5[key]==='oui');
      btnNon.classList.toggle('selected', state.s5[key]==='non');
    }
    btnOui.addEventListener('click', ()=>{ state.s5[key] = (state.s5[key]==='oui'?null:'oui'); refresh(); renderPathologyLine(); });
    btnNon.addEventListener('click', ()=>{ state.s5[key] = (state.s5[key]==='non'?null:'non'); refresh(); renderPathologyLine(); });
    refresh();
    toggle.appendChild(btnOui); toggle.appendChild(btnNon);
    top.appendChild(toggle);
    box.appendChild(top);
    const path = el('p',{class:'pathology', id:'path-'+key});
    box.appendChild(path);
    function renderPathologyLine(){
      path.innerHTML = state.s5[key]==='non' ? ('→ <b>'+pathologies[key]+'</b>') : '';
    }
    renderPathologyLine();
    return box;
  }

  function buildSlide5(){
    const wrap = el('div', {class:'slide-inner'});
    wrap.appendChild(el('p',{class:'eyebrow'},[el('span',{class:'num'},[document.createTextNode('05')]),document.createTextNode(' — Test de validation')]));
    wrap.appendChild(el('h1',{class:'question'},[document.createTextNode('La transformation résiste-t-elle à l\u2019épreuve des faits ?')]));
    wrap.appendChild(el('p',{class:'hint'},[document.createTextNode('Quatre questions fermées. Un seul « non » suffit à révéler une pathologie.')]));
    wrap.appendChild(crashQuestion('q1','Le Client tire-t-il un bénéfice réel et direct ?'));
    wrap.appendChild(crashQuestion('q2','Les Acteurs ont-ils concrètement les moyens d\u2019exécuter ?'));
    wrap.appendChild(crashQuestion('q3','L\u2019Owner a-t-il, dans les faits, le pouvoir d\u2019arbitrer ?'));
    wrap.appendChild(crashQuestion('q4','La croyance (W) résiste-t-elle encore, formulée autrement ?'));

    const adj = el('div',{class:'adjustment'});
    adj.appendChild(el('label',{},[document.createTextNode('Zone d\u2019ajustement — reformulation de T ou W')]));
    const ta = el('textarea',{rows:3, placeholder:'Si au moins un « non » est apparu, notez ici la reformulation immédiate.'});
    ta.value = state.s5.ajustement || '';
    ta.addEventListener('input', ()=>{ state.s5.ajustement = ta.value; });
    adj.appendChild(ta);
    wrap.appendChild(adj);
    return wrap;
  }

  function buildSlide6(){
    const wrap = el('div', {class:'slide-inner'});
    wrap.appendChild(el('p',{class:'eyebrow'},[el('span',{class:'num'},[document.createTextNode('06')]),document.createTextNode(' — Levier unique & plan d\u2019action')]));
    wrap.appendChild(el('h1',{class:'question'},[document.createTextNode('Quel est le seul levier à activer maintenant ?')]));
    wrap.appendChild(el('p',{class:'hint'},[document.createTextNode('Un seul levier à la fois — activer plusieurs leviers en parallèle rend impossible de savoir lequel a produit l\u2019effet.')]));
    wrap.appendChild(field('Action précise', 'une phrase concrète, pas « améliorer la communication »', 'action', state.s6, {textarea:true, rows:2, placeholder:'Ex : « Faire valider les critères du projet par le comité X »'}));
    const grid = el('div',{class:'grid-2'});
    grid.appendChild(field('Porteur unique', 'celui qui a le plus intérêt à ce que ça marche', 'porteur', state.s6, {}));
    grid.appendChild(field('Délai de revue', '2 à 4 semaines recommandé', 'delai', state.s6, {type:'date'}));
    wrap.appendChild(grid);
    wrap.appendChild(field('Signal de vérification', 'un fait observable, non ambigu — pas une impression', 'signal', state.s6, {textarea:true, rows:2}));
    return wrap;
  }

  function synthRow(k, v){
    const row = el('div',{class:'synth-row'});
    row.appendChild(el('div',{class:'k'},[document.createTextNode(k)]));
    const val = el('div',{class:'v'+(v?'':' empty')},[document.createTextNode(v || '—')]);
    row.appendChild(val);
    return row;
  }

  function buildSynthesis(){
    const wrap = el('div', {class:'slide-inner'});

    const head = el('div',{class:'synth-head'});
    const hLeft = el('div');
    hLeft.appendChild(el('h1',{},[document.createTextNode('Synthèse de séance')]));
    const dirig = state.meta.dirigeant || 'dirigeant non renseigné';
    const ent = state.meta.entreprise ? (' — '+state.meta.entreprise) : '';
    hLeft.appendChild(el('div',{class:'meta'},[document.createTextNode(dirig+ent+' · '+(state.meta.date||''))]));
    head.appendChild(hLeft);
    const actions = el('div',{class:'synth-actions'});
    const btnCopy = el('button',{},[document.createTextNode('Copier')]);
    btnCopy.addEventListener('click', copySynthesis);
    const btnPrint = el('button',{},[document.createTextNode('Imprimer')]);
    btnPrint.addEventListener('click', ()=> window.print());
    actions.appendChild(btnCopy); actions.appendChild(btnPrint);
    head.appendChild(actions);
    wrap.appendChild(head);

    const sec1 = el('div',{class:'synth-section'});
    sec1.appendChild(el('h2',{},[document.createTextNode('01 · Cadrage')]));
    sec1.appendChild(synthRow('Problème', state.s1.enonce));
    sec1.appendChild(synthRow('Déclencheur', state.s1.declencheur));
    wrap.appendChild(sec1);

    const sec2 = el('div',{class:'synth-section'});
    sec2.appendChild(el('h2',{},[document.createTextNode('02 · Cartographie')]));
    sec2.appendChild(synthRow('Acteurs réels', state.s2.acteurs));
    sec2.appendChild(synthRow('Ressources effectives', state.s2.ressources));
    sec2.appendChild(synthRow('Contraintes dures', state.s2.contraintes));
    sec2.appendChild(synthRow('Points de tension', state.s2.tensions));
    wrap.appendChild(sec2);

    const sec3 = el('div',{class:'synth-section'});
    sec3.appendChild(el('h2',{},[document.createTextNode('03 · Transformation & Weltanschauung')]));
    const t3 = state.s3;
    const phrase = 'Faire passer '+(t3.systeme||'…')+' de '+(t3.etatA||'…')+' à '+(t3.etatB||'…')+' pour '+(t3.t||'…')+', parce que je crois que '+(t3.w||'…')+'.';
    sec3.appendChild(synthRow('Formulation', phrase));
    wrap.appendChild(sec3);

    const sec4 = el('div',{class:'synth-section'});
    sec4.appendChild(el('h2',{},[document.createTextNode('04 · CATWOE')]));
    sec4.appendChild(synthRow('Client', state.s4.client));
    sec4.appendChild(synthRow('Acteurs', state.s4.acteurs));
    sec4.appendChild(synthRow('Owner', state.s4.owner));
    sec4.appendChild(synthRow('Environnement', state.s4.environnement));
    wrap.appendChild(sec4);

    const sec5 = el('div',{class:'synth-section'});
    sec5.appendChild(el('h2',{},[document.createTextNode('05 · Crash-test')]));
    const qLabels = {q1:'Bénéfice Client', q2:'Moyens des Acteurs', q3:'Pouvoir de l\u2019Owner', q4:'Solidité de W'};
    ['q1','q2','q3','q4'].forEach(k=>{
      const v = state.s5[k];
      let disp = v ? (v==='oui'?'Oui':'Non — '+pathologies[k]) : '—';
      sec5.appendChild(synthRow(qLabels[k], disp));
    });
    if(state.s5.ajustement){ sec5.appendChild(synthRow('Ajustement de T/W', state.s5.ajustement)); }
    wrap.appendChild(sec5);

    const sec6 = el('div',{class:'synth-section'});
    sec6.appendChild(el('h2',{class:'lever-label'},[document.createTextNode('06 · Levier unique & plan d\u2019action')]));
    const lev = el('div',{class:'synth-lever'});
    lev.appendChild(synthRow('Action', state.s6.action));
    lev.appendChild(synthRow('Porteur', state.s6.porteur));
    lev.appendChild(synthRow('Signal de vérification', state.s6.signal));
    lev.appendChild(synthRow('Revue prévue le', state.s6.delai));
    sec6.appendChild(lev);
    wrap.appendChild(sec6);

    return wrap;
  }

  function synthesisText(){
    const t3 = state.s3;
    const phrase = 'Faire passer '+(t3.systeme||'…')+' de '+(t3.etatA||'…')+' à '+(t3.etatB||'…')+' pour '+(t3.t||'…')+', parce que je crois que '+(t3.w||'…')+'.';
    const qLabels = {q1:'Bénéfice Client', q2:'Moyens des Acteurs', q3:'Pouvoir de l\u2019Owner', q4:'Solidité de W'};
    let lines = [];
    lines.push('DIAGNOSTIC SYSTÉMIQUE — SYNTHÈSE DE SÉANCE');
    lines.push((state.meta.dirigeant||'—')+(state.meta.entreprise?(' — '+state.meta.entreprise):'')+' · '+(state.meta.date||''));
    lines.push('');
    lines.push('01 · CADRAGE');
    lines.push('Problème : '+(state.s1.enonce||'—'));
    lines.push('Déclencheur : '+(state.s1.declencheur||'—'));
    lines.push('');
    lines.push('02 · CARTOGRAPHIE');
    lines.push('Acteurs réels : '+(state.s2.acteurs||'—'));
    lines.push('Ressources effectives : '+(state.s2.ressources||'—'));
    lines.push('Contraintes dures : '+(state.s2.contraintes||'—'));
    lines.push('Points de tension : '+(state.s2.tensions||'—'));
    lines.push('');
    lines.push('03 · TRANSFORMATION & WELTANSCHAUUNG');
    lines.push(phrase);
    lines.push('');
    lines.push('04 · CATWOE');
    lines.push('Client : '+(state.s4.client||'—'));
    lines.push('Acteurs : '+(state.s4.acteurs||'—'));
    lines.push('Owner : '+(state.s4.owner||'—'));
    lines.push('Environnement : '+(state.s4.environnement||'—'));
    lines.push('');
    lines.push('05 · CRASH-TEST');
    ['q1','q2','q3','q4'].forEach(k=>{
      const v = state.s5[k];
      lines.push(qLabels[k]+' : '+(v ? (v==='oui'?'Oui':'Non — '+pathologies[k]) : '—'));
    });
    if(state.s5.ajustement) lines.push('Ajustement de T/W : '+state.s5.ajustement);
    lines.push('');
    lines.push('06 · LEVIER UNIQUE & PLAN D\u2019ACTION');
    lines.push('Action : '+(state.s6.action||'—'));
    lines.push('Porteur : '+(state.s6.porteur||'—'));
    lines.push('Signal de vérification : '+(state.s6.signal||'—'));
    lines.push('Revue prévue le : '+(state.s6.delai||'—'));
    return lines.join('\n');
  }

  function copySynthesis(){
    const text = synthesisText();
    navigator.clipboard.writeText(text).then(()=>{
      const btn = document.querySelector('.synth-actions button');
      if(btn){ const old = btn.textContent; btn.textContent = 'Copié'; setTimeout(()=>btn.textContent=old, 1400); }
    }).catch(()=>{});
  }

  const builders = [buildSlide0, buildSlide1, buildSlide2, buildSlide3, buildSlide4, buildSlide5, buildSlide6, buildSynthesis];

  // ---------------- render shell ----------------
  const stage = document.getElementById('stage');
  const app = document.getElementById('app');
  const progressFill = document.getElementById('progressFill');
  const stepDots = document.getElementById('stepDots');
  const sessionName = document.getElementById('sessionName');
  const sessionTag = document.getElementById('sessionTag');
  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');

  const slideEls = builders.map((fn, i)=>{
    const slide = el('div', {class:'slide'}, [fn()]);
    stage.appendChild(slide);
    return slide;
  });

  STEP_LABELS.forEach((label, i)=>{
    const dot = el('button', {class:'step-dot'}, [document.createTextNode(i===7 ? '✓' : String(i))]);
    dot.title = label;
    dot.addEventListener('click', ()=> goTo(i));
    stepDots.appendChild(dot);
  });

  function refreshShell(){
    const pct = (current/LAST_STEP)*100;
    progressFill.style.width = pct+'%';
    app.classList.toggle('on-synthesis', current===LAST_STEP);

    [...stepDots.children].forEach((d,i)=> d.classList.toggle('active', i===current));

    btnPrev.disabled = current===0;
    btnNext.textContent = current===LAST_STEP ? 'Nouvelle séance' : (current===6 ? 'Voir la synthèse' : 'Suivant');

    sessionName.textContent = state.meta.dirigeant ? ('· '+state.meta.dirigeant) : '';
    sessionTag.textContent = STEP_LABELS[current];
  }

  function rerenderSlide(i){
    // rebuild a slide's inner content from current state (used for synthesis + rebuilding step0 date default)
    const fresh = el('div', {class:'slide active'}, [builders[i]()]);
    stage.replaceChild(fresh, slideEls[i]);
    slideEls[i] = fresh;
  }

  function goTo(i){
    if(i<0 || i>LAST_STEP) return;
    slideEls[current].classList.remove('active');
    current = i;
    if(i===LAST_STEP){ rerenderSlide(i); }
    slideEls[current].classList.add('active');
    refreshShell();
  }

  btnPrev.addEventListener('click', ()=>{
    if(current>0) goTo(current-1);
  });
  btnNext.addEventListener('click', ()=>{
    if(current===LAST_STEP){ resetSession(); return; }
    goTo(current+1);
  });

  function resetSession(){
    if(!confirm('Démarrer une nouvelle séance ? Les données actuelles seront effacées.')) return;
    state.meta = { dirigeant:'', entreprise:'', date: new Date().toISOString().slice(0,10) };
    state.s1 = { enonce:'', declencheur:'' };
    state.s2 = { acteurs:'', ressources:'', contraintes:'', tensions:'' };
    state.s3 = { systeme:'', etatA:'', etatB:'', t:'', w:'' };
    state.s4 = { client:'', acteurs:'', owner:'', environnement:'' };
    state.s5 = { q1:null, q2:null, q3:null, q4:null, ajustement:'' };
    state.s6 = { action:'', porteur:'', signal:'', delai:'' };
    builders.forEach((fn,i)=>{
      const fresh = el('div', {class:'slide'+(i===0?' active':'')}, [fn()]);
      stage.replaceChild(fresh, slideEls[i]);
      slideEls[i] = fresh;
    });
    current = 0;
    refreshShell();
  }

  document.addEventListener('keydown', (e)=>{
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if(tag==='TEXTAREA' || tag==='INPUT') return;
    if(e.key==='ArrowRight'){ if(current===LAST_STEP) resetSession(); else goTo(current+1); }
    if(e.key==='ArrowLeft'){ goTo(current-1); }
  });

  slideEls[0].classList.add('active');
  refreshShell();

})();
</script>
</body>
</html>
