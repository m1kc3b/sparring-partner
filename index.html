<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sparring Partner — Diagnostic systémique</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app" id="app">

        <div class="topbar">
            <div class="wordmark">
                <div class="name">Sparring Partner <span id="sessionName"></span></div>
                <div class="session-tag" id="sessionTag"></div>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="step-dots" id="stepDots"></div>
        </div>

        <div class="stage" id="stage"></div>

        <div class="navbar">
            <button class="btn btn-ghost" id="btnPrev">Précédent</button>
            <div class="kbd-hint">Naviguer : <kbd>←</kbd> <kbd>→</kbd></div>
            <button class="btn btn-primary" id="btnNext">Suivant</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
